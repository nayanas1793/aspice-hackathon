
name: Spring Boot ASPICE CI Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  aspice-evidence:

    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Maven build and test
      - name: Maven Build and Tests
        run: |
          mvn clean verify

      # Publish JUnit report
      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # SonarQube
      - name: SonarQube Analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.3.1.6422:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

      # Trivy filesystem scan
      - name: Trivy Filesystem Scan
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: '0'

      # Docker build
      - name: Docker Build
        if: success()
        run: |
          docker build -t aspice-demo:${{ github.sha }} .

      # Docker image scan
      - name: Trivy Docker Scan
        if: success()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: aspice-demo:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image-results.json
          exit-code: '0'

      # Upload Trivy results
      - name: Publish Trivy SARIF
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif

      # Collect evidence metadata
      - name: Generate ASPICE metadata
        if: always()
        run: |
          mkdir -p aspice-report

          echo "Project: Spring Boot ASPICE" \
            > aspice-report/build-info.txt

          echo "Commit: $GITHUB_SHA" \
            >> aspice-report/build-info.txt

          echo "Build: $GITHUB_RUN_NUMBER" \
            >> aspice-report/build-info.txt

          echo "Branch: $GITHUB_REF_NAME" \
            >> aspice-report/build-info.txt

      # Publish reports
      - name: Upload ASPICE Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Evidence-Report
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            trivy-fs-results.sarif
            trivy-image-results.json
            aspice-report/
          retention-days: 90
          if-no-files-found: warn
