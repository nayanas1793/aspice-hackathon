
name: Spring Boot ASPICE CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # 0. REQUIREMENT TRACEABILITY
  requirement-traceability:
    name: 0 - Requirement Traceability
    runs-on: ubuntu-latest
    environment: Dev
    if: github.event_name == 'pull_request'

    outputs:
      jira_issue_keys: ${{ steps.check.outputs.jira_issue_keys }}

    steps:
      - name: Validate Jira requirement issues
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: KAN
        run: |
          set -euo pipefail

          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::error::Configure JIRA_BASE_URL, JIRA_EMAIL, and JIRA_API_TOKEN as GitHub Actions secrets."
            exit 1
          fi

          text="$PR_TITLE $PR_BODY"
          mapfile -t issue_keys < <(printf '%s' "$text" | grep -oE "${JIRA_PROJECT_KEY}-[0-9]+" | sort -u || true)

          if [ "${#issue_keys[@]}" -eq 0 ]; then
            echo "::error::Add a Jira requirement key (for example KAN-1) to the pull request title or description."
            exit 1
          fi

          jira_url="${JIRA_BASE_URL%/}"
          for issue_key in "${issue_keys[@]}"; do
            if ! issue_json=$(curl --fail --silent --show-error \
              --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              --header "Accept: application/json" \
              "$jira_url/rest/api/3/issue/${issue_key}?fields=project,summary,labels"); then
              echo "::error::Could not retrieve Jira issue ${issue_key}. Check the Jira secrets, token permissions, and issue key."
              exit 1
            fi

            project_key=$(jq -r '.fields.project.key // empty' <<< "$issue_json")
            summary=$(jq -r '.fields.summary // empty' <<< "$issue_json")
            is_requirement=$(jq -r '(.fields.labels // []) | any(. == "aspice-requirement")' <<< "$issue_json")
            if [ "$project_key" != "$JIRA_PROJECT_KEY" ] || [ -z "$summary" ] || [ "$is_requirement" != "true" ]; then
              echo "::error::${issue_key} must exist in Jira project ${JIRA_PROJECT_KEY} and have the aspice-requirement label."
              exit 1
            fi
            echo "Verified Jira issue ${issue_key}: ${summary}"
          done

          issue_keys_csv=$(IFS=,; echo "${issue_keys[*]}")
          echo "jira_issue_keys=${issue_keys_csv}" >> "$GITHUB_OUTPUT"

  # SOFTWARE BILL OF MATERIALS
  dependency-sbom:
    name: Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: aspice-sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Software-Bill-of-Materials
          path: aspice-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  # 1. MAVEN BUILD
  maven-build:
    name: 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Package
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: |
          test -n "$(find target -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Upload Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Application-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7


  # 2. UNIT TEST AND JACOCO
  unit-test:
    name: 2 - JUnit and JaCoCo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Tests and Coverage
        run: mvn -B clean verify

      - name: Check Test Reports
        if: always()
        run: |
          echo "=== Surefire reports ==="
          find target/surefire-reports -type f -print || true

          echo "=== Failsafe reports ==="
          find target/failsafe-reports -type f -print || true

          echo "=== JaCoCo reports ==="
          find target/site/jacoco -type f -print || true

      - name: Publish JUnit Results
        if: always()
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # v2.1.1
        with:
          name: JUnit Test Results
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Test-Reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/classes/
            target/test-classes/
          if-no-files-found: warn
          retention-days: 90


  # 3. SONARCLOUD
  sonarqube:
    name: 3 - SonarCloud Analysis
    runs-on: ubuntu-latest
    environment: Dev
    needs: unit-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Test and Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Test-Reports
          path: target

      - name: Verify JaCoCo Report
        run: |
          test -f target/site/jacoco/jacoco.xml

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Download SonarCloud Measures
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          mkdir -p sonar-evidence

          curl --fail --silent --show-error \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=coverage,bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density,sqale_index,reliability_rating,security_rating,sqale_rating,ncloc" \
            -o sonar-evidence/sonar-measures.json

          curl --fail --silent --show-error \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" \
            -o sonar-evidence/sonar-quality-gate.json

          curl --fail --silent --show-error \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&resolved=false&ps=500" \
            -o sonar-evidence/sonar-issues.json

          echo "SonarCloud evidence downloaded."
          ls -lh sonar-evidence/

      - name: Upload SonarCloud Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Sonar-Reports
          path: sonar-evidence/
          if-no-files-found: warn
          retention-days: 90


  # 4. TRIVY FILESYSTEM SCAN
  trivy-fs:
    name: 4 - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-fs-results.json
          exit-code: '0'

      - name: Upload Filesystem Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Trivy-Filesystem
          path: trivy-fs-results.json
          if-no-files-found: warn
          retention-days: 90


  # 5. DOCKER BUILD
  docker-build:
    name: 5 - Docker Image Build
    runs-on: ubuntu-latest
    needs: maven-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Application-JAR
          path: target

      - name: Docker Build
        run: |
          IMAGE="${IMAGE_NAME,,}"
          TAG="${GITHUB_SHA}"

          docker build -t "$IMAGE:$TAG" .
          docker save "$IMAGE:$TAG" -o aspice-docker-image.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: aspice-docker-image.tar
          retention-days: 2


  # 6. TRIVY IMAGE SCAN
  trivy-image:
    name: 6 - Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: image

      - name: Load Docker Image
        run: docker load -i image/aspice-docker-image.tar

      - name: Set Lowercase Image Name
        id: image-name
        run: |
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-name.outputs.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image-results.json
          exit-code: '0'

      - name: Upload Image Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Trivy-Image
          path: trivy-image-results.json
          if-no-files-found: warn
          retention-days: 90


  # 7. DOCKER PUSH
  docker-push:
    name: 7 - Docker Image Push
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - trivy-image

    if: >-
      github.event_name != 'pull_request' &&
      needs.docker-build.result == 'success' &&
      needs.trivy-image.result == 'success'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.push-image.outputs.image }}
      tag: ${{ steps.push-image.outputs.tag }}
      digest: ${{ steps.push-image.outputs.digest }}

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: image

      - name: Load Docker Image
        run: docker load -i image/aspice-docker-image.tar

      - name: Login to GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        id: push-image
        run: |
          IMAGE="${IMAGE_NAME,,}"
          SHA_TAG="${GITHUB_SHA}"
          BRANCH_TAG=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
            | cut -c1-120)
          BRANCH_TAG=${BRANCH_TAG:-branch}

          docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$BRANCH_TAG"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$BRANCH_TAG"

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE:$SHA_TAG" | cut -d '@' -f 2)

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


  # 8. ASPICE REPORT
  aspice-report:
    name: 8 - ASPICE Evidence Report
    runs-on: ubuntu-latest
    if: always()

    needs:
      - requirement-traceability
      - maven-build
      - unit-test
      - sonarqube
      - dependency-sbom
      - trivy-fs
      - docker-build
      - trivy-image
      - docker-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Test and Coverage Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ASPICE-Test-Reports
          path: evidence/tests

      - name: Download SBOM Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ASPICE-Software-Bill-of-Materials
          path: evidence/sbom

      - name: Download Trivy Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ASPICE-Trivy-*
          path: evidence/trivy
          merge-multiple: false

      - name: Download SonarCloud Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ASPICE-Sonar-Reports
          path: evidence/sonar

      - name: Display Evidence
        if: always()
        run: |
          find evidence -type f -print || true

      - name: Generate ASPICE Report
        env:
          REQUIREMENT_TRACE_RESULT: ${{ needs.requirement-traceability.result }}
          JIRA_ISSUE_KEYS: ${{ needs.requirement-traceability.outputs.jira_issue_keys }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          BUILD_RESULT: ${{ needs.maven-build.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          SBOM_RESULT: ${{ needs.dependency-sbom.result }}
          TRIVY_FS_RESULT: ${{ needs.trivy-fs.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          TRIVY_IMAGE_RESULT: ${{ needs.trivy-image.result }}
          DOCKER_PUSH_RESULT: ${{ needs.docker-push.result }}

          DOCKER_IMAGE: ${{ needs.docker-push.outputs.image || 'ghcr.io/${{ github.repository }}' }}
          DOCKER_TAG: ${{ needs.docker-push.outputs.tag || github.sha }}
          DOCKER_DIGEST: ${{ needs.docker-push.outputs.digest || 'Not available' }}

        run: |
          python3 -m py_compile scripts/generate_aspice_report.py
          python3 scripts/generate_aspice_report.py

          test -s aspice-report/aspice-report.html
          test -s aspice-report/aspice-report.json

      - name: Publish ASPICE Summary
        if: always()
        env:
          REQUIREMENT_TRACE_RESULT: ${{ needs.requirement-traceability.result }}
          JIRA_ISSUE_KEYS: ${{ needs.requirement-traceability.outputs.jira_issue_keys }}
          BUILD_RESULT: ${{ needs.maven-build.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          SBOM_RESULT: ${{ needs.dependency-sbom.result }}
          TRIVY_FS_RESULT: ${{ needs.trivy-fs.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          TRIVY_IMAGE_RESULT: ${{ needs.trivy-image.result }}
          DOCKER_PUSH_RESULT: ${{ needs.docker-push.result }}
        run: |
          {
            echo "# ASPICE Evidence Report"
            echo ""
            echo "| CI Stage | Result |"
            echo "|---|---|"
            echo "| Requirement Traceability | $REQUIREMENT_TRACE_RESULT |"
            echo "| Jira Requirement Issues | ${JIRA_ISSUE_KEYS:-Not available} |"
            echo "| Maven Build | $BUILD_RESULT |"
            echo "| Unit Tests | $TEST_RESULT |"
            echo "| SonarCloud | $SONAR_RESULT |"
            echo "| Software Bill of Materials | $SBOM_RESULT |"
            echo "| Trivy Filesystem | $TRIVY_FS_RESULT |"
            echo "| Docker Build | $DOCKER_BUILD_RESULT |"
            echo "| Trivy Image | $TRIVY_IMAGE_RESULT |"
            echo "| Docker Push | $DOCKER_PUSH_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Final ASPICE Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Final-Report
          path: |
            aspice-report/
            evidence/
          if-no-files-found: warn
          retention-days: 90
  
  # --------------------------------------------------
  # JOB 9: DEPLOY ASPICE HTML REPORT
  # --------------------------------------------------
  deploy-aspice-report:
    name: 9 - Deploy ASPICE HTML Report
    runs-on: ubuntu-latest

    needs:
      - aspice-report

    if: >-
      ${{ !cancelled() && needs.aspice-report.result == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Download existing ASPICE artifact
      - name: Download ASPICE report artifact
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Final-Report
          path: downloaded-artifact

      # Step 2: Display downloaded structure
      - name: Verify downloaded files
        run: |
          set -e

          echo "Downloaded artifact structure:"
          find downloaded-artifact -type f -print

      # Step 3: Locate HTML and prepare Pages directory
      - name: Prepare HTML for deployment
        run: |
          set -e

          HTML_FILE=$(find downloaded-artifact \
            -type f \
            -name "aspice-report.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "::error::ASPICE HTML report not found"
            exit 1
          fi

          test -s "$HTML_FILE"

          mkdir -p pages-site

          cp "$HTML_FILE" pages-site/index.html
          cp "$HTML_FILE" pages-site/aspice-report.html

          echo "HTML report successfully prepared"

          ls -lh pages-site/

      # Step 4: Upload HTML to GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      # Step 5: Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Step 6: Download deployed HTML and validate
      - name: Download and validate deployed HTML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e

          echo "Deployed URL: $PAGE_URL"

          curl --fail --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            "$PAGE_URL" \
            -o downloaded-aspice-report.html

          test -s downloaded-aspice-report.html

          grep -qi "ASPICE" downloaded-aspice-report.html

          echo "ASPICE HTML download successful"
          echo "ASPICE HTML validation successful"

      # Step 7: Save downloaded copy
      - name: Upload downloaded HTML validation copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Deployed-HTML-Validation
          path: downloaded-aspice-report.html
          if-no-files-found: warn
          retention-days: 30
